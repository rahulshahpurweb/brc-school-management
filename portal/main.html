<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjZYYhrYb_f9C6I4eK5j4DHzBJ4ZoglrRnEum0CJkQ_RkImrnzCW7wMsJakbaenT-gfQ/exec";

// 1. Check Global Maintenance from Cloud Google Sheet
async function checkGlobalMaintenance() {
  let isMaintenance = false;
  try {
    let res = await fetch(`${WEB_APP_URL}?action=getMaintenance`);
    let data = await res.json();
    isMaintenance = data.maintenance === true;
    localStorage.setItem("brc_maintenance_mode", isMaintenance ? "true" : "false");
  } catch(e) {
    isMaintenance = localStorage.getItem("brc_maintenance_mode") === "true";
  }

  let isLoggedIn = localStorage.getItem("brc_logged_in") === "true";
  let user = JSON.parse(localStorage.getItem("brc_logged_user") || "{}");
  
  if (!isLoggedIn) {
    document.getElementById("maintenanceOverlay").style.display = "none";
    document.getElementById("authOverlay").style.display = "flex";
    updateMaintUI(isMaintenance);
    return;
  }

  if (user.role === "admin") {
    document.getElementById("maintenanceOverlay").style.display = "none";
    document.getElementById("authOverlay").style.display = "none";
    updateMaintUI(isMaintenance);
    return;
  }

  if (isMaintenance && user.role && user.role !== "admin") {
    document.getElementById("maintenanceOverlay").style.display = "flex";
    document.getElementById("authOverlay").style.display = "none";
  } else {
    document.getElementById("maintenanceOverlay").style.display = "none";
  }
  updateMaintUI(isMaintenance);
}

window.addEventListener('DOMContentLoaded', async () => {
  await checkGlobalMaintenance();
  
  let user = JSON.parse(localStorage.getItem("brc_logged_user") || "{}");
  if (user.role === 'admin' || user.name === 'BRC Admin') {
    let adminSec = document.getElementById("adminControlsSection");
    if(adminSec) adminSec.style.display = "block";
  }
});

function toggleDrawer() {
  const drawer = document.getElementById('sideDrawer');
  const backdrop = document.getElementById('drawerBackdrop');
  drawer.classList.toggle('open');
  backdrop.classList.toggle('open');
}

function triggerFeatureControl() {
  toggleDrawer();
  const iframeWin = document.getElementById('moduleFrame').contentWindow;
  if(iframeWin && typeof iframeWin.openFeatureControl === 'function') {
    iframeWin.openFeatureControl();
  } else {
    alert("Feature control settings are available inside the modules.");
  }
}

function updateMaintUI(isMaint) {
  let btn = document.getElementById("maintToggleBtn");
  if(btn) {
    if(isMaint) {
      btn.innerText = "🔴 ON (Site Band Hai)";
      btn.style.background = "#dc2626";
      btn.style.color = "#fff";
    } else {
      btn.innerText = "🟢 OFF (Site Live Hai)";
      btn.style.background = "#16a34a";
      btn.style.color = "#fff";
    }
  }
}

async function toggleMaintenance() {
  let isMaint = localStorage.getItem("brc_maintenance_mode") === "true";
  let newMaintState = !isMaint;

  try {
    let res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "setMaintenance", maintenance: newMaintState })
    });
    let r = await res.json();
    if(r.status === "success") {
      localStorage.setItem("brc_maintenance_mode", newMaintState ? "true" : "false");
      alert(newMaintState ? "Portal MAINTENANCE mode par chala gaya hai!" : "Portal ab LIVE kar diya gaya hai!");
    } else {
      alert("Maintenance update karne mein error aayi.");
    }
  } catch(err) {
    alert("Network error: Maintenance update nahi ho payi.");
  }

  updateMaintUI(newMaintState);
  location.reload();
}

// 2. Cloud Credentials Based Auth Check (Google Sheet Credentials Tab)
async function checkAuth(){
  const inputVal = document.getElementById("authUserInput").value.trim();
  const passVal = document.getElementById("authPass").value.trim();
  const err = document.getElementById("authErr");
  let isMaintenance = localStorage.getItem("brc_maintenance_mode") === "true";

  if(!inputVal || !passVal) {
    err.innerText = "Kripya User ID aur Password dono dalein!";
    err.style.display = "block";
    return;
  }

  if (isMaintenance && inputVal !== "admin") {
    err.innerText = "Portal par maintenance chal rahi hai. Abhi login band hai.";
    err.style.display = "block";
    return;
  }

  err.innerText = "Cloud credentials se verification ho raha hai...";
  err.style.display = "block";

  try {
    let response = await fetch(`${WEB_APP_URL}?action=getCredentials`);
    let credentials = await response.json();

    if (Array.isArray(credentials)) {
      let matchedUser = credentials.find(c => String(c.userId).trim() === inputVal);
      
      if (matchedUser) {
        if (matchedUser.password === passVal) {
          localStorage.setItem("brc_logged_in", "true");
          localStorage.setItem("brc_logged_user", JSON.stringify({ 
            role: matchedUser.role, 
            udise: matchedUser.role === 'school' ? matchedUser.userId : '', 
            name: matchedUser.name || matchedUser.userId 
          }));
          document.getElementById("authOverlay").style.display = "none";
          document.getElementById("maintenanceOverlay").style.display = "none";
          location.reload();
          return;
        } else {
          err.innerText = "Galat Password! Kripya sahi password dalein.";
          err.style.display = "block";
          return;
        }
      }
    }
  } catch (e) {
    console.log("Cloud credential fetch failed.");
  }

  // Emergency Admin Fallback
  if (inputVal === "admin" && passVal === "brc@shahpur") {
    localStorage.setItem("brc_logged_in", "true");
    localStorage.setItem("brc_logged_user", JSON.stringify({ role: 'admin', name: 'BRC Admin' }));
    document.getElementById("authOverlay").style.display = "none";
    location.reload();
    return;
  }

  err.innerText = "Wrong User ID Or Password!";
  err.style.display = "block";
}

function logoutSession(){
  localStorage.removeItem("brc_logged_in");
  localStorage.removeItem("brc_logged_user");
  document.getElementById("authOverlay").style.display = "flex";
}

function loadModule(fileName, btnElement){
  document.getElementById('moduleFrame').src = fileName;
  document.querySelectorAll('.drawer-link').forEach(b => b.classList.remove('active'));
  if(btnElement) btnElement.classList.add('active');
  toggleDrawer();
}
</script>
