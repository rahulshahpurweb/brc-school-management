<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRC Shahpur - Master Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b2854;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* Top Master Portal Bar */
.master-header{background:linear-gradient(135deg,#071b38,#0e3d7e);color:white;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f4b400;flex-shrink:0;flex-wrap:wrap;gap:10px}
.brand-title{font-size:17px;font-weight:900;letter-spacing:.3px;display:flex;align-items:center;gap:8px}

/* Module Tabs */
.module-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.mod-tab{background:#ffffff18;color:#e2e8f0;border:1px solid #ffffff33;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:bold;white-space:nowrap;cursor:pointer;transition:all 0.2s ease}
.mod-tab:hover{background:#ffffff30;color:#fff}
.mod-tab.active{background:#ffd21c;color:#082a63;border-color:#ffd21c;box-shadow:0 2px 8px rgba(0,0,0,0.3)}

/* Frame Container */
.frame-container{flex:1;width:100%;height:100%;background:#f4f7fb}
#moduleFrame{width:100%;height:100%;border:0}
</style>
</head>
<body>

<header class="master-header">
  <div class="brand-title">
    <span>🏛️ जनपद शिक्षा केन्द्र शाहपुर | BRC Portal</span>
  </div>

  <!-- MODULE TABS: Yahan se aap alag-alag modules switch kar sakenge -->
  <div class="module-tabs">
    <button class="mod-tab active" onclick="loadModule('R2.html', this)">📊 Shiksha Sanjeevani (R2)</button>
    <!-- Jab R3 ya koi naya module banayein, yahan button jod sakte hain -->
    <a href="../index.html" class="mod-tab" style="background:#dc2626;border-color:#dc2626;color:#fff;">🚪 Public Portal</a>
  </div>
</header>

<div class="frame-container">
  <!-- Default pehle R2.html open hoga -->
  <iframe id="moduleFrame" src="R2.html"></iframe>
</div>

<script>
function loadModule(fileName, btnElement){
  document.getElementById('moduleFrame').src = fileName;
  document.querySelectorAll('.mod-tab').forEach(b => b.classList.remove('active'));
  if(btnElement) btnElement.classList.add('active');
}
</script>

</body>
</html>
