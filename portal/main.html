<script>
const ADMIN_PASS = "brc@shahpur";
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRbPEcNgjpFXFGnqVVtVBdTsjlo_mMEy23SS3DggMAk2BRuy_M324DohO9JpYDPhoh_w/exec";

function checkGlobalMaintenance() {
  let isMaintenance = localStorage.getItem("brc_maintenance_mode") === "true";
  let isLoggedIn = localStorage.getItem("brc_logged_in") === "true"; // sessionStorage ki jagah localStorage
  let user = JSON.parse(localStorage.getItem("brc_current_user") || localStorage.getItem("brc_logged_user") || "{}");
  
  if (!isLoggedIn) {
    document.getElementById("maintenanceOverlay").style.display = "none";
    document.getElementById("authOverlay").style.display = "flex";
    updateMaintUI(isMaintenance);
    return;
  }

  if (user.role === "admin") {
    document.getElementById("maintenanceOverlay").style.display = "none";
    document.getElementById("authOverlay").style.display = "none";
    updateMaintUI(isMaintenance);
    return;
  }

  if (isMaintenance && user.role && user.role !== "admin") {
    document.getElementById("maintenanceOverlay").style.display = "flex";
    document.getElementById("authOverlay").style.display = "none";
  } else {
    document.getElementById("maintenanceOverlay").style.display = "none";
  }
  updateMaintUI(isMaintenance);
}

window.addEventListener('DOMContentLoaded', () => {
  checkGlobalMaintenance();
  
  let user = JSON.parse(localStorage.getItem("brc_current_user") || localStorage.getItem("brc_logged_user") || "{}");
  if (user.role === 'admin' || user.name === 'BRC Admin') {
    let adminSec = document.getElementById("adminControlsSection");
    if(adminSec) adminSec.style.display = "block";
  }
});

function toggleDrawer() {
  const drawer = document.getElementById('sideDrawer');
  const backdrop = document.getElementById('drawerBackdrop');
  drawer.classList.toggle('open');
  backdrop.classList.toggle('open');
}

function triggerFeatureControl() {
  toggleDrawer();
  const iframeWin = document.getElementById('moduleFrame').contentWindow;
  if(iframeWin && typeof iframeWin.openFeatureControl === 'function') {
    iframeWin.openFeatureControl();
  } else {
    alert("Feature control settings are available inside the modules.");
  }
}

function updateMaintUI(isMaint) {
  let btn = document.getElementById("maintToggleBtn");
  if(btn) {
    if(isMaint) {
      btn.innerText = "🔴 ON (Site Band Hai)";
      btn.style.background = "#dc2626";
      btn.style.color = "#fff";
    } else {
      btn.innerText = "🟢 OFF (Site Live Hai)";
      btn.style.background = "#16a34a";
      btn.style.color = "#fff";
    }
  }
}

function toggleMaintenance() {
  let isMaint = localStorage.getItem("brc_maintenance_mode") === "true";
  if(isMaint) {
    localStorage.setItem("brc_maintenance_mode", "false");
    alert("Portal ab LIVE kar diya gaya hai!");
  } else {
    if(confirm("Maintenance mode par daalna chahte hain?")) {
      localStorage.setItem("brc_maintenance_mode", "true");
      alert("Portal MAINTENANCE mode par chala gaya hai!");
    }
  }
  updateMaintUI(!isMaint);
  location.reload();
}

async function checkAuth(){
  const inputVal = document.getElementById("authUserInput").value.trim();
  const passVal = document.getElementById("authPass").value.trim();
  const err = document.getElementById("authErr");
  let isMaintenance = localStorage.getItem("brc_maintenance_mode") === "true";

  if(!inputVal || !passVal) {
    err.innerText = "Kripya User ID aur Password dono dalein!";
    err.style.display = "block";
    return;
  }

  // 1. Admin Login
  if(inputVal === ADMIN_PASS || (inputVal === "admin" && passVal === ADMIN_PASS)) {
    localStorage.setItem("brc_logged_in", "true"); // localStorage use kiya
    localStorage.setItem("brc_logged_user", JSON.stringify({ role: 'admin', name: 'BRC Admin' }));
    document.getElementById("authOverlay").style.display = "none";
    document.getElementById("maintenanceOverlay").style.display = "none";
    location.reload();
    return;
  }

  // 2. Maintenance Check
  if (isMaintenance) {
    err.innerText = "Portal par maintenance chal rahi hai. Abhi JSK/School login band hai.";
    err.style.display = "block";
    return;
  }

  // 3. JSK Login
  if(inputVal === "jsk_login") {
    if(passVal === "jskpassword" || passVal === "brc@123") {
      localStorage.setItem("brc_logged_in", "true"); // localStorage use kiya
      localStorage.setItem("brc_logged_user", JSON.stringify({ role: 'jsk', name: 'JSK Coordinator' }));
      document.getElementById("authOverlay").style.display = "none";
      location.reload();
      return;
    } else {
      err.innerText = "JSK ka password galat hai!";
      err.style.display = "block";
      return;
    }
  }

  // 4. School Login (Cloud First with Instant Local/Pattern Fallback)
  err.innerText = "Login ho raha hai, kripya intezar karein...";
  err.style.display = "block";

  let schoolFound = false;
  let schoolName = "School UDISE: " + inputVal;

  try {
    let activeSess = localStorage.getItem("brc_active_session") || "2026-27";
    let response = await fetch(`${WEB_APP_URL}?session=${activeSess}`);
    let schools = await response.json();

    if (Array.isArray(schools)) {
      let found = schools.find(s => String(s.udise).trim() === inputVal);
      if (found) {
        schoolFound = true;
        schoolName = found.name;
      }
    }
  } catch (e) {
    console.log("Cloud fetch skipped during login, using direct validation.");
  }

  // Agar cloud mein mil gaya YAA user ne valid UDISE code dala hai (6+ digit)
  if (schoolFound || (inputVal.length >= 6 && !isNaN(inputVal))) {
    if (passVal === "12345" || passVal === inputVal) {
      localStorage.setItem("brc_logged_in", "true"); // localStorage use kiya
      localStorage.setItem("brc_logged_user", JSON.stringify({ role: 'school', udise: inputVal, name: schoolName }));
      document.getElementById("authOverlay").style.display = "none";
      location.reload();
      return;
    } else {
      err.innerText = "School ka password galat hai! (Password: 12345 ya UDISE Code)";
      err.style.display = "block";
      return;
    }
  }

  err.innerText = "Wrong Password Or UDISE Code!";
  err.style.display = "block";
}

function logoutSession(){
  localStorage.removeItem("brc_logged_in");
  localStorage.removeItem("brc_logged_user");
  document.getElementById("authOverlay").style.display = "flex";
}

function loadModule(fileName, btnElement){
  document.getElementById('moduleFrame').src = fileName;
  document.querySelectorAll('.drawer-link').forEach(b => b.classList.remove('active'));
  if(btnElement) btnElement.classList.add('active');
  toggleDrawer();
}
</script>
