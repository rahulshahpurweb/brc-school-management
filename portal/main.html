<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRC Shahpur - Master Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b2854;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* Top Master Portal Bar */
.master-header{background:linear-gradient(135deg,#071b38,#0e3d7e);color:white;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f4b400;flex-shrink:0;flex-wrap:wrap;gap:10px}
.brand-title{font-size:17px;font-weight:900;letter-spacing:.3px;display:flex;align-items:center;gap:8px}

/* Module Tabs */
.module-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.mod-tab{background:#ffffff18;color:#e2e8f0;border:1px solid #ffffff33;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:bold;white-space:nowrap;cursor:pointer;transition:all 0.2s ease}
.mod-tab:hover{background:#ffffff30;color:#fff}
.mod-tab.active{background:#ffd21c;color:#082a63;border-color:#ffd21c;box-shadow:0 2px 8px rgba(0,0,0,0.3)}

/* Frame Container */
.frame-container{flex:1;width:100%;height:100%;background:#f4f7fb}
#moduleFrame{width:100%;height:100%;border:0}

/* LOGIN OVERLAY WITH SNA BUTTON */
#authOverlay{position:fixed;inset:0;background:rgba(8,42,99,0.95);backdrop-filter:blur(6px);z-index:99999;display:flex;align-items:center;justify-content:center;padding:15px}
.auth-card{background:#ffffff;border-radius:18px;max-width:390px;width:100%;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,0.3);text-align:center}
.auth-card h2{margin-top:0;color:#082a63}
.auth-card p{color:#64748b;font-size:13px;margin-bottom:16px}
.auth-input{width:100%;height:46px;border:1px solid #cbd5e1;border-radius:10px;padding:0 12px;font-size:15px;margin-bottom:12px}
.auth-btn{width:100%;height:46px;background:#1769df;color:#fff;border:0;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;margin-bottom:10px}
.auth-btn:hover{background:#145dc6}
.sna-link-btn{display:block;width:100%;height:44px;background:#10b981;color:#fff;border-radius:10px;font-weight:bold;font-size:14px;text-decoration:none;line-height:44px;box-shadow:0 3px 8px rgba(16,185,129,0.3)}
.sna-link-btn:hover{background:#059669}
.auth-err{color:#dc2626;background:#fee2e2;padding:8px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>

<!-- Login Lock Screen supporting Admin Master Password or School UDISE Code -->
<div id="authOverlay">
  <div class="auth-card">
    <h2>🔐 BRC_Login</h2>
    <p>Enter Admin password or School UDISE Code.</p>
    <div id="authErr" class="auth-err">Wrong Password Or UDISE Code!</div>
    <input type="text" id="authUserInput" class="auth-input" placeholder="Admin Pass / UDISE Code" onkeydown="if(event.key==='Enter')checkAuth()">
    <input type="password" id="authPass" class="auth-input" placeholder="Password (Enter password)" onkeydown="if(event.key==='Enter')checkAuth()">
    <button class="auth-btn" onclick="checkAuth()">Login</button>
    
    <div style="margin:12px 0 8px;font-size:12px;color:#94a3b8;font-weight:bold;">--- Or---</div>
    
    <!-- Separate SNA Account Check Button -->
    <a href="../index.html" class="sna-link-btn">🔍 SNA Account Check </a>
  </div>
</div>

<header class="master-header">
  <div class="brand-title">
    <span>🏛️ Janpad Shiksha Kendra Shahpur | BRC Portal</span>
  </div>

  <div class="module-tabs">
    <button class="mod-tab active" onclick="loadModule('R2.html', this)">📊 Enrollment</button>
    <button class="mod-tab" onclick="loadModule('R3.html', this)">♿ CWSN</button>
    <a href="../index.html" class="mod-tab" style="background:#0d9488;border-color:#0d9488;color:#fff;">🔍 SNA Account Check</a>
    <button class="mod-tab" onclick="logoutSession()" style="background:#dc2626;border-color:#dc2626;color:#fff;">🚪 Logout</button>
  </div>
</header>

<div class="frame-container">
  <iframe id="moduleFrame" src="R2.html"></iframe>
</div>

<script>
const ADMIN_PASS = "brc@shahpur";
let inactivityTimer;

function checkAuth(){
  const inputVal = document.getElementById("authUserInput").value.trim();
  const passVal = document.getElementById("authPass").value.trim();
  const err = document.getElementById("authErr");

  // 1. Admin Master Login Check (Agar pehla input password hai ya user 'admin' hai)
  if(inputVal === ADMIN_PASS || inputVal === "admin" && passVal === ADMIN_PASS) {
    sessionStorage.setItem("brc_logged_in", "true");
    localStorage.setItem("brc_logged_user", JSON.stringify({ role: 'admin', name: 'BRC Admin' }));
    document.getElementById("authOverlay").style.display = "none";
    resetInactivityTimer();
    return;
  }

  // Agar sirf single box mein password dala ho purane tarike se
  if(passVal === "" && inputVal === ADMIN_PASS) {
    sessionStorage.setItem("brc_logged_in", "true");
    localStorage.setItem("brc_logged_user", JSON.stringify({ role: 'admin', name: 'BRC Admin' }));
    document.getElementById("authOverlay").style.display = "none";
    resetInactivityTimer();
    return;
  }

  // 2. School UDISE Login Check
  let schools = JSON.parse(localStorage.getItem("brc_schools_data_2026-27") || "[]");
  let foundSchool = schools.find(s => String(s.udise).trim() === inputVal);

  if(foundSchool) {
    let p = passVal || "12345";
    if(p === "12345" || p === String(foundSchool.udise).trim()) {
      sessionStorage.setItem("brc_logged_in", "true");
      localStorage.setItem("brc_logged_user", JSON.stringify({ 
        role: 'school', 
        udise: foundSchool.udise, 
        name: foundSchool.name 
      }));
      document.getElementById("authOverlay").style.display = "none";
      resetInactivityTimer();
      // Frame reload taaki school restricted view load ho jaye
      document.getElementById('moduleFrame').src = document.getElementById('moduleFrame').src;
      return;
    }
  }

  err.style.display = "block";
}

if(sessionStorage.getItem("brc_logged_in") === "true"){
  document.getElementById("authOverlay").style.display = "none";
  resetInactivityTimer();
} else {
  document.getElementById("authOverlay").style.display = "flex";
}

function logoutSession(){
  sessionStorage.removeItem("brc_logged_in");
  localStorage.removeItem("brc_logged_user");
  document.getElementById("authOverlay").style.display = "flex";
  document.getElementById("authUserInput").value = "";
  document.getElementById("authPass").value = "";
}

function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    alert("Session Timeout");
    logoutSession();
  }, 1500000); 
}

window.onload = function() {
  const events = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
  events.forEach(eventName => {
    document.addEventListener(eventName, () => {
      if(sessionStorage.getItem("brc_logged_in") === "true") {
        resetInactivityTimer();
      }
    }, true);
  });
};

function loadModule(fileName, btnElement){
  document.getElementById('moduleFrame').src = fileName;
  document.querySelectorAll('.mod-tab').forEach(b => b.classList.remove('active'));
  if(btnElement) btnElement.classList.add('active');
}
</script>

</body>
</html>
