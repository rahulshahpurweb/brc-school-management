<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modular Enrollment Portal - BRC Shahpur</title>
<!-- Global CSS Styles -->
<link rel="stylesheet" href="r2-styles.css">
<!-- SheetJS for Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <h1>BRC Shahpur - Modular Enrollment Portal (R2)</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <label style="font-size:13px;font-weight:bold;">Academic Session:</label>
    <select id="sessionSelect" onchange="SessionManager.changeSession()" style="font-weight:bold;color:#1d4ed8;"></select>
  </div>
</header>

<nav>
  <button onclick="showTab('dash')">📊 Summary</button>
  <button onclick="showTab('records')">📋 School List</button>
  <button onclick="showTab('entry')">✍️ Data Entry</button>
  <button onclick="showTab('compilation')">📑 JSK Compilation</button>
  <button class="secondary" onclick="location.href='../index.html'">🏠 Home</button>
  <button class="success" onclick="ExcelHandler.exportExcel()" style="margin-left:auto">📥 Download</button>
  <label class="button" style="background:#d97706;color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:bold;">
    📤 Upload <input type="file" id="excelFile" accept=".xlsx" style="display:none" onchange="ExcelHandler.uploadExcel(event)">
  </label>
</nav>

<main>
  <!-- Tabs Sections -->
  <section id="dash" class="active">
    <h3>📊 Overall Summary Dashboard</h3>
    <div class="grid" id="dashboardStats"></div>
  </section>

  <section id="records">
    <h3>📋 School-wise Data & Filters</h3>
    <div class="filter-bar" id="filterBarContainer"></div>
    <div class="tablewrap"><table id="schoolTable"><thead></thead><tbody id="schoolTableBody"></tbody></table></div>
  </section>

  <section id="entry">
    <h3>✍️ School Data Entry Module</h3>
    <div class="filter-bar" id="entrySelectorContainer"></div>
    <div class="tablewrap"><table><thead></thead><tbody id="entryTableBody"></tbody></table></div>
    <div style="margin-top:15px;text-align:right;"><button onclick="EntryModule.saveData()">💾 Save Data</button></div>
  </section>

  <section id="compilation">
    <h3>📑 JSK-wise Compilation Report</h3>
    <div class="tablewrap"><table id="compileTable"><thead></thead><tbody id="compileTableBody"></tbody></table></div>
  </section>
</main>

<!-- Link all small modular scripts -->
<script src="schools-data.js"></script>
<script src="session-manager.js"></script>
<script src="entry-module.js"></script>
<script src="compilation.js"></script>
<script src="excel-handler.js"></script>
<script>
function showTab(id){
  document.querySelectorAll("main section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id === 'entry') EntryModule.init();
  if(id === 'compilation') CompilationModule.init();
}
window.onload = function(){
  SessionManager.init();
}
</script>
</body>
</html>
